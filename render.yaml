# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: clinical-management-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: MONGODB_URI
        sync: false # set in dashboard (MongoDB Atlas connection string)
      - key: MONGODB_DB
        value: clinical_management
      - key: CLINIC_TIMEZONE
        value: Asia/Kolkata
      - key: JWT_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false # voicebot patient history (Claude)
      - key: CORS_ORIGINS
        sync: false # set to your Vercel URL, e.g. https://clinical-management.vercel.app
